<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Login</title>

    <link rel="stylesheet" href="login.css">

    <!-- Fonts: Poppins for headings, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Welcome overlay styling lives in style.css so both pages share it -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Welcome overlay: the very first thing a new visitor sees,
         before they even reach the registration form -->
    <div id="welcomeOverlay" class="welcome-overlay">
        <div class="welcome-card">
            <img src="https://ptu.ac.in/wp-content/uploads/2020/05/ptu-logo-transparent.png"
                 alt="IKGPTU Logo" class="welcome-logo">
            <h1 class="welcome-title">Welcome to IKGPTU</h1>
            <p class="welcome-subtitle">I.K. Gujral Punjab Technical University</p>
            <p class="welcome-text">
                Your Smart Campus Navigator — register below to unlock
                live GPS tracking and turn-by-turn directions around campus.
            </p>
            <button id="welcomeStartBtn" class="welcome-btn">Get Started</button>
        </div>
    </div>

<div class="container">

    <h1>🏫 Smart Campus</h1>
    <h2>Student Registration</h2>

    <form id="registerForm">

        <label>Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <label>Phone Number</label>
        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            required
        >

        <label>Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option value="Engineering">Engineering</option>
            <option value="Management">Management</option>
            <option value="Applied Courses">Applied Courses</option>
        </select>

        <label>Course</label>
        <select id="course" required>
            <option value="">Select Course</option>
        </select>

        <label>Batch</label>
        <select id="batch" required>
            <option value="">Select Batch</option>
        </select>

        <button type="submit">
            Register & Continue
        </button>

    </form>

</div>

<script src="login.js"></script>

</body>
</html>
