<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Campus Navigation</title>

    <!-- Registration gate: send unregistered visitors to login.html first.
         Placed early in <head> so it redirects before the map renders. -->
    <script>
    const studentToken = localStorage.getItem("studentToken");

    if (!studentToken) {
        window.location.href = "login.html";
    }
</script>

    <!-- Fonts: Poppins for headings, Inter for body/data text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet"
    href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

    <!-- Sticky app header -->
    <header class="app-header">
        <img src="https://ptu.ac.in/wp-content/uploads/2020/05/ptu-logo-transparent.png" alt="IKGPTU" class="app-header-logo">
        <span class="app-header-title">Smart Campus Navigation</span>
    </header>

    <!-- Search Box -->
    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search a building or department..."
        >
        <button id="resetBtn" type="button">Reset</button>
        <!-- TEMPORARY: DELETE THIS BUTTON BEFORE FINAL SUBMISSION -->
<button id="testModeBtn" type="button" onclick="toggleTestMode()">
    🧪 Test Mode: OFF
</button>
        <button id="cancelRouteBtn" onclick="cancelNavigation()">
            ❌ Cancel Navigation
        </button>
    </div>

    <!-- Live search results dropdown -->
    <div id="searchResults" class="search-results"></div>

    <!-- No Results Message -->
    <div id="noResults" class="no-results">
        😕 No location found. Try a different search or filter.
    </div>

    <!-- Category Filters, styled as pill chips -->
    <div class="filters">

        <label class="filter-chip"><input type="checkbox" value="Entrance" checked> Entrance</label>
        <label class="filter-chip"><input type="checkbox" value="Academic" checked> Academic</label>
        <label class="filter-chip"><input type="checkbox" value="Administration" checked> Administration</label>
        <label class="filter-chip"><input type="checkbox" value="Food" checked> Food</label>
        <label class="filter-chip"><input type="checkbox" value="Sports" checked> Sports</label>
        <label class="filter-chip"><input type="checkbox" value="Parking" checked> Parking</label>
        <label class="filter-chip"><input type="checkbox" value="Service" checked> Service</label>
        <label class="filter-chip"><input type="checkbox" value="Facility" checked> Facility</label>
        <label class="filter-chip"><input type="checkbox" value="Auditorium" checked> Auditorium</label>
        <label class="filter-chip"><input type="checkbox" value="Hostel" checked> Hostel</label>

    </div>

    <div class="nearest-box">
        <button onclick="findNearest('Parking')">🚗 Nearest Parking</button>
        <button onclick="findNearest('Food')">🍴 Nearest Food</button>
        <button onclick="openAssistant()">🧠 Smart Assistant</button>
    </div>

    <div id="assistantPanel" class="assistant-panel">

        <h2>🧠 Smart Campus Assistant</h2>

        <div class="assistant-grid">

            <div class="card" onclick="assistantAction('study')">
                📚<br>Study
            </div>

            <div class="card">💻<br>Code</div>

            <div class="card">🍴<br>Food</div>

            <div class="card">🌳<br>Relax</div>

            <div class="card">🚗<br>Parking</div>

            <div class="card">🏥<br>Medical</div>

            <div class="card">🏧<br>ATM</div>

            <div class="card">🚻<br>Washroom</div>

        </div>

        <button class="close-btn" onclick="closeAssistant()">
            Close
        </button>

    </div>

    <div id="adminPanel" class="admin-panel">

        <h2>🔐 Admin Panel</h2>

        <div class="admin-row">

            <div class="admin-field">
                <label>Location Name</label>
                <input type="text" id="adminName">
            </div>

            <div class="admin-field">
                <label>Category</label>
                <select id="adminCategory">
                    <option>Entrance</option>
                    <option>Academic</option>
                    <option>Administration</option>
                    <option>Food</option>
                    <option>Sports</option>
                    <option>Parking</option>
                    <option>Service</option>
                    <option>Facility</option>
                    <option>Auditorium</option>
                    <option>Hostel</option>
                </select>
            </div>

        </div>

        <div class="admin-field">
            <label>Description</label>
            <textarea id="adminDescription"></textarea>
        </div>

        <div class="admin-row">

            <div class="admin-field">
                <label>Latitude</label>
                <input type="text" id="adminLatitude">
            </div>

            <div class="admin-field">
                <label>Longitude</label>
                <input type="text" id="adminLongitude">
            </div>

        </div>

        <div class="admin-buttons">

            <button id="getLocationBtn" onclick="captureLocation()">
                📍 Get Current Location
            </button>

            <button id="generateJsonBtn" onclick="generateJSON()">
                📄 Generate JSON
            </button>

            <!-- FIX: removed inline onclick="closeAdmin()" (that function
                 didn't exist). script.js already wires this button's
                 click handler via getElementById("closeAdmin").onclick -->
            <button id="closeAdmin">
                ❌ Close
            </button>

        </div>

        <textarea
            rows="8"
            id="generatedJson"
            readonly
            placeholder="Generated JSON will appear here">
        </textarea>

    </div>

    <!-- Map -->
    <!-- Map + floating buttons + building info panel -->
    <div class="map-wrapper">

        <div id="map"></div>

        <!-- Tells the user which building's entrance their walking
     directions actually start from, when their GPS position
     resolves inside/near a building (this app has no indoor
     floor plans, so it can't route from a specific floor) -->
<div id="startPointBanner" class="start-point-banner">
    <span id="startPointBannerText"></span>
    <span class="start-point-banner-close" id="startPointBannerClose">✕</span>
</div>

        <!-- Shown while a route is being calculated (or while waiting
             for GPS), hidden as soon as the route is ready or fails -->
        <div id="routeLoadingIndicator" class="route-loading-indicator">
            <span class="route-loading-spinner"></span>
            <span id="routeLoadingText">Finding your location...</span>
        </div>

        <!-- Compact turn-by-turn directions card: sits in the empty space
             at the top of the map instead of the old full-height list.
             Tap the chevron to shrink it to a thin bar; tap the card
             itself to see every step in a bottom sheet. -->
        <div id="directionsCard" class="directions-card">
            <div class="directions-card-main">
                <span id="directionsIcon" class="directions-icon">⬆️</span>

                <!-- The whole text area opens the complete turn-by-turn sheet. -->
                <button id="directionsExpandBtn" class="directions-text directions-expand-btn"
                        type="button" title="View all directions">
                    <span id="directionsInstruction" class="directions-instruction">Continue straight</span>
                    <span class="directions-meta">
                        <span id="directionsDistance">-- m</span>
                        <span class="directions-meta-dot">·</span>
                        <span id="directionsSummaryText"></span>
                    </span>
                </button>

                <button id="directionsMinimizeBtn" class="directions-minimize-btn"
                        type="button" title="Minimize" aria-label="Minimize directions">⌄</button>

                <button id="directionsCloseBtn" class="directions-close-btn"
                        type="button" title="Close directions" aria-label="Close directions">✕</button>
            </div>
        </div>

        <!-- Small reopen button shown after the directions card is closed. -->
        <button id="directionsReopenBtn" type="button" class="directions-reopen-btn"
                title="Show directions" aria-label="Show directions">🧭</button>

        <!-- Recenter button: appears when the user pans/zooms away from
             their own position during navigation, so the map doesn't
             fight their touch by auto-recentering underneath it. -->
        <button id="recenterBtn" type="button" class="fab recenter-fab" title="Recenter">🎯</button>

        <!-- Full step-by-step list, opened from the directions card -->
        <div id="directionsSheet" class="directions-sheet">
            <div class="building-panel-handle"></div>
            <button id="directionsSheetClose" class="building-panel-close" type="button" aria-label="Close directions">✕</button>
            <h2 class="directions-sheet-title">Directions</h2>
            <div id="directionsStepsList" class="directions-steps-list"></div>
        </div>

        <!-- Floating action buttons -->
        <button id="locationBtn" type="button" class="fab fab-primary" title="My Location">📍</button>
        <button id="adminBtn" onclick="openAdmin()" class="fab" title="Admin">🔐</button>
        <button id="installBtn" type="button" class="fab" style="display:none;" title="Install App">📲</button>

        <!-- Building info bottom sheet: replaces the old cramped map popup -->
        <div id="buildingPanel" class="building-panel">
            <div class="building-panel-handle"></div>
            <button id="closeBuildingPanel" class="building-panel-close">✕</button>
            <div id="buildingPanelContent"></div>
        </div>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <!-- Our JavaScript -->
    <script src="script.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
